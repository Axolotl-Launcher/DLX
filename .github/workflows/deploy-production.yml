name: Deploy production
on:
  workflow_run:
    workflows: [Publish images]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable Git commit SHA image tag to deploy (manual rollback/repair)
        required: false
        type: string
permissions: { contents: read }
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    environment: production
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.image_tag != '')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy published image
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          script: /usr/local/bin/axolotl-deploy ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.image_tag }}
