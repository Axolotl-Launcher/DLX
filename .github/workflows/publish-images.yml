name: Publish images
on:
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
env:
  GHCR_OWNER: axolotl-launcher
jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: dlx
            dockerfile: Dockerfile
          - image: sponsor-gateway
            dockerfile: sponsor-gateway/Dockerfile
          - image: sponsor-web
            dockerfile: sponsor-web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ env.GHCR_OWNER }}/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/${{ env.GHCR_OWNER }}/${{ matrix.image }}:main
